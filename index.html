<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Визуализация данных</title>

    <link rel="stylesheet" href="CSS/style.css">

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="JavaScript/data.js"></script>
    <script src="JavaScript/table.js"></script>
    <script src="JavaScript/chart.js"></script>
    <script src="JavaScript/main.js"></script>
</head>
<body>

    <h3>Список самых высоких зданий</h3>

    <form id="graphForm">
        <p>Значение по оси OX</p>

        <label>
            <input type="radio" name="axisX" value="Страна" checked>
            Страна
        </label>

        <br>

        <label>
            <input type="radio" name="axisX" value="Год">
            Год
        </label>

        <p>Значение по оси OY</p>

        <label>
            <input type="checkbox" name="axisY" value="max" checked>
            Максимальная высота
        </label>

        <br>

        <label>
            <input type="checkbox" name="axisY" value="min">
            Минимальная высота
        </label>

        <p>Тип графика</p>

        <select id="chartType">
            <option value="dot">Точечная диаграмма</option>
            <option value="bar">Гистограмма</option>
        </select>

        <br><br>

        <button type="button" id="drawBtn">Построить</button>

        <p id="error"></p>
    </form>

    <svg></svg>

    <br>

    <button id="tableBtn">Скрыть таблицу</button>

    <table id="build"></table>

</body>
</html>
